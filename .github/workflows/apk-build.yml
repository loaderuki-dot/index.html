name: Nexorya APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Java o‘rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android vositalari
        uses: android-actions/setup-android@v3

      - name: Gradle o‘rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ilova fayllarini yaratish
        shell: bash
        run: |
          mkdir -p app/src/main/java/uz/nexorya/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Nexorya'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'uz.nexorya.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'uz.nexorya.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="Nexorya"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/uz/nexorya/app/MainActivity.java <<'EOF'
          package uz.nexorya.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.*;
          import android.widget.*;

          public class MainActivity extends Activity {
              private WebView web;
              private LinearLayout root;
              private TextView status;
              private View fullscreen;
              private WebChromeClient.CustomViewCallback callback;

              private final String HOME =
                  "https://nexoryauz.netlify.app/";

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(
                      Color.rgb(9, 13, 24)
                  );

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(9, 13, 24));

                  LinearLayout bar = new LinearLayout(this);

                  Button back = new Button(this);
                  back.setText("‹");
                  bar.addView(back);

                  Button reload = new Button(this);
                  reload.setText("Yangilash");
                  bar.addView(reload);

                  status = new TextView(this);
                  status.setText("Nexorya");
                  status.setTextColor(Color.WHITE);
                  bar.addView(status);

                  root.addView(bar);

                  web = new WebView(this);
                  root.addView(
                      web,
                      new LinearLayout.LayoutParams(
                          -1, 0, 1
                      )
                  );

                  setContentView(root);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );
                  settings.setMediaPlaybackRequiresUserGesture(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view,
                          WebResourceRequest request
                      ) {
                          if (!request.isForMainFrame()) {
                              return false;
                          }

                          Uri url = request.getUrl();

                          if (
                              "https".equals(url.getScheme()) &&
                              "nexoryauz.netlify.app"
                                  .equalsIgnoreCase(url.getHost())
                          ) {
                              return false;
                          }

                          String scheme = url.getScheme();

                          if (
                              "https".equals(scheme) ||
                              "http".equals(scheme) ||
                              "tg".equals(scheme)
                          ) {
                              try {
                                  startActivity(
                                      new Intent(
                                          Intent.ACTION_VIEW,
                                          url
                                      )
                                  );
                              } catch (Exception error) {
                                  Toast.makeText(
                                      MainActivity.this,
                                      "Havolani ochib bo‘lmadi",
                                      Toast.LENGTH_SHORT
                                  ).show();
                              }
                          }

                          return true;
                      }

                      @Override
                      public void onPageStarted(
                          WebView view,
                          String url,
                          android.graphics.Bitmap icon
                      ) {
                          status.setText("Yuklanmoqda…");
                      }

                      @Override
                      public void onPageFinished(
                          WebView view,
                          String url
                      ) {
                          status.setText("Nexorya");
                      }

                      @Override
                      public void onReceivedError(
                          WebView view,
                          WebResourceRequest request,
                          WebResourceError error
                      ) {
                          if (request.isForMainFrame()) {
                              Toast.makeText(
                                  MainActivity.this,
                                  "Internet yoki saytni tekshiring",
                                  Toast.LENGTH_LONG
                              ).show();
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(
                          View view,
                          CustomViewCallback cb
                      ) {
                          if (fullscreen != null) {
                              cb.onCustomViewHidden();
                              return;
                          }

                          fullscreen = view;
                          callback = cb;
                          root.setVisibility(View.GONE);

                          addContentView(
                              view,
                              new ViewGroup.LayoutParams(-1, -1)
                          );
                      }

                      @Override
                      public void onHideCustomView() {
                          hideFullscreen();
                      }
                  });

                  back.setOnClickListener(
                      view -> onBackPressed()
                  );

                  reload.setOnClickListener(
                      view -> web.loadUrl(HOME)
                  );

                  web.loadUrl(HOME);
              }

              private void hideFullscreen() {
                  if (fullscreen == null) return;

                  ((ViewGroup) fullscreen.getParent())
                      .removeView(fullscreen);

                  fullscreen = null;
                  root.setVisibility(View.VISIBLE);

                  if (callback != null) {
                      callback.onCustomViewHidden();
                      callback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (fullscreen != null) {
                      hideFullscreen();
                  } else if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  web.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: APK yig‘ish
        run: gradle --no-daemon assembleDebug

      - name: APK nomini belgilash
        run: cp app/build/outputs/apk/debug/app-debug.apk Nexorya.apk

      - name: APKni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Nexorya-APK
          path: Nexorya.apk
          if-no-files-found: error
          retention-days: 7
