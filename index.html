<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Shodiyona</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* ENVELOPE CARD */
    .envelope-wrapper {
      position: relative;
      z-index: 10;
      cursor: pointer;
      transition: transform 0.5s ease, opacity 0.8s ease;
    }
    .envelope-wrapper.hide {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }
    .envelope {
      width: 260px;
      height: 170px;
      background: rgba(15, 5, 25, 0.7);
      border: 2px solid rgba(255, 80, 140, 0.7);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 50, 120, 0.5), inset 0 0 15px rgba(255, 50, 120, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      backdrop-filter: blur(8px);
    }
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 95px solid rgba(255, 100, 150, 0.35);
    }
    .btn-for-you {
      padding: 12px 28px;
      background: linear-gradient(45deg, #ff2a75, #ff6496);
      border: none;
      border-radius: 25px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(255, 42, 117, 0.8);
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 2;
    }
    .btn-for-you:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255, 42, 117, 1);
    }

    /* CONTROLS */
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      gap: 10px;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: 0.3s;
    }
    .icon-btn:hover {
      background: rgba(255, 42, 117, 0.4);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="controls">
    <button class="icon-btn" id="replay-btn" title="Qayta boshlash">↺</button>
  </div>

  <div class="envelope-wrapper" id="envelope">
    <div class="envelope">
      <button class="btn-for-you">FOR YOU</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 35);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    let stage = 0; 
    let time = 0;

    // SHODIYONA YOZUVI (ZARRACHALAR)
    function createTextParticles() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024;
      canvas.height = 256;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'Bold 110px "Brush Script MT", cursive, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Shodiyona', canvas.width / 2, canvas.height / 2);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const points = [];

      for (let y = 0; y < canvas.height; y += 4) {
        for (let x = 0; x < canvas.width; x += 4) {
          const alpha = imgData[(y * canvas.width + x) * 4];
          if (alpha > 128) {
            const posX = (x - canvas.width / 2) * 0.045;
            const posY = -(y - canvas.height / 2) * 0.045 - 4.5;
            points.push(new THREE.Vector3(posX, posY, 0));
          }
        }
      }
      return points;
    }

    const textPoints = createTextParticles();
    const textGeo = new THREE.BufferGeometry();
    const textPos = new Float32Array(textPoints.length * 3);
    textPoints.forEach((p, i) => {
      textPos[i * 3] = p.x;
      textPos[i * 3 + 1] = p.y;
      textPos[i * 3 + 2] = p.z;
    });
    textGeo.setAttribute('position', new THREE.BufferAttribute(textPos, 3));
    const textMat = new THREE.PointsMaterial({
      size: 0.38,
      color: 0xff4d8d,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const textMesh = new THREE.Points(textGeo, textMat);
    scene.add(textMesh);

    // SPIRAL / GUL QISMI (VIDEODAGIDEK)[span_2](start_span)[span_2](end_span)
    const spiralCount = 3500;
    const spiralGeo = new THREE.BufferGeometry();
    const spiralPos = new Float32Array(spiralCount * 3);
    const spiralColors = new Float32Array(spiralCount * 3);

    for (let i = 0; i < spiralCount; i++) {
      spiralPos[i * 3] = 0;
      spiralPos[i * 3 + 1] = 0;
      spiralPos[i * 3 + 2] = 0;

      const c = new THREE.Color().setHSL(0.93 + Math.random() * 0.05, 1, 0.6);
      spiralColors[i * 3] = c.r;
      spiralColors[i * 3 + 1] = c.g;
      spiralColors[i * 3 + 2] = c.b;
    }
    spiralGeo.setAttribute('position', new THREE.BufferAttribute(spiralPos, 3));
    spiralGeo.setAttribute('color', new THREE.BufferAttribute(spiralColors, 3));

    const spiralMat = new THREE.PointsMaterial({
      size: 0.45,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const spiralMesh = new THREE.Points(spiralGeo, spiralMat);
    spiralMesh.position.y = 3;
    scene.add(spiralMesh);

    // YASHIL POYA
    const stemCount = 1200;
    const stemGeo = new THREE.BufferGeometry();
    const stemPos = new Float32Array(stemCount * 3);
    const stemColors = new Float32Array(stemCount * 3);

    for (let i = 0; i < stemCount; i++) {
      stemPos[i * 3] = 0;
      stemPos[i * 3 + 1] = 0;
      stemPos[i * 3 + 2] = 0;

      const c = new THREE.Color(0x00ff66);
      stemColors[i * 3] = c.r;
      stemColors[i * 3 + 1] = c.g;
      stemColors[i * 3 + 2] = c.b;
    }
    stemGeo.setAttribute('position', new THREE.BufferAttribute(stemPos, 3));
    stemGeo.setAttribute('color', new THREE.BufferAttribute(stemColors, 3));

    const stemMat = new THREE.PointsMaterial({
      size: 0.35,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const stemMesh = new THREE.Points(stemGeo, stemMat);
    scene.add(stemMesh);

    // KLIK HODISASI
    const envelope = document.getElementById('envelope');
    const replayBtn = document.getElementById('replay-btn');

    envelope.addEventListener('click', () => {
      if (stage !== 0) return;
      stage = 1;
      time = 0;
      envelope.classList.add('hide');
    });

    replayBtn.addEventListener('click', () => {
      stage = 0;
      time = 0;
      envelope.classList.remove('hide');
      textMat.opacity = 0;
      spiralMat.opacity = 0;
      stemMat.opacity = 0;
    });

    // ANIMATSIYA SIKLI
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (stage === 1) {
        time += delta;

        textMat.opacity = Math.min(time * 0.8, 1);
        spiralMat.opacity = Math.min(time * 0.9, 0.9);

        const sArr = spiralGeo.attributes.position.array;
        for (let i = 0; i < spiralCount; i++) {
          const progress = Math.min(time * 0.8, 1);
          const theta = i * 0.08 + time * 2.5;
          const r = (i / spiralCount) * 14 * progress;

          const wave = Math.sin(theta * 3) * 0.8;
          sArr[i * 3] = (r + wave) * Math.cos(theta);
          sArr[i * 3 + 1] = (r + wave) * Math.sin(theta) * 0.5;
          sArr[i * 3 + 2] = Math.sin(r * 1.5) * 2;
        }
        spiralGeo.attributes.position.needsUpdate = true;

        if (time > 1.2) {
          stemMat.opacity = Math.min((time - 1.2) * 1.2, 0.95);
          const stArr = stemGeo.attributes.position.array;
          for (let i = 0; i < stemCount; i++) {
            const t = (i / stemCount);
            const stemProgress = Math.min((time - 1.2) * 1.5, 1);
            
            stArr[i * 3] = (Math.random() - 0.5) * 0.4;
            stArr[i * 3 + 1] = -4 + (t * 6.5 * stemProgress);
            stArr[i * 3 + 2] = (Math.random() - 0.5) * 0.4;
          }
          stemGeo.attributes.position.needsUpdate = true;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
