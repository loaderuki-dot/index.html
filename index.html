<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexorya — Film va rasm qidiruv</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #0b0f17;
    color: #fff;
    min-height: 100vh;
  }
  header {
    padding: 24px;
    text-align: center;
    background: linear-gradient(90deg, #111827, #1e293b);
  }
  header h1 { font-size: 30px; margin-bottom: 8px; }
  header p { color: #94a3b8; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .search-box {
    display: flex;
    gap: 10px;
    margin: 24px 0;
  }
  input {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #111827;
    color: #fff;
    font-size: 16px;
  }
  button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    background: #ef4444;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab {
    padding: 10px 18px;
    border-radius: 999px;
    background: #1e293b;
    cursor: pointer;
  }
  .tab.active { background: #ef4444; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
  }
  .card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
  }
  .card img { width: 100%; height: 270px; object-fit: cover; }
  .card-info { padding: 12px; }
  .card-info h3 { font-size: 16px; margin-bottom: 6px; }
  .card-info p { color: #94a3b8; font-size: 13px; }
  .result { margin-top: 20px; }
  .trailer {
    margin-top: 20px;
    aspect-ratio: 16 / 9;
    width: 100%;
    border-radius: 14px;
    border: none;
  }
  .watch-links { margin-top: 14px; }
  .watch-links a {
    display: inline-block;
    margin: 5px 8px 5px 0;
    padding: 10px 14px;
    background: #1e293b;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
  }
  .credit {
    margin-top: 30px;
    font-size: 13px;
    color: #94a3b8;
    text-align: center;
  }
  .credit a { color: #60a5fa; }
</style>
</head>
<body>

<header>
  <h1>Nexorya Media</h1>
  <p>Film, serial va rasm qidiruv platformasi</p>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('movie')">Film va seriallar</div>
    <div class="tab" onclick="switchTab('image')">Rasmlar</div>
  </div>

  <div class="search-box">
    <input id="query" placeholder="Film, serial yoki rasm nomini yozing...">
    <button onclick="search()">Qidirish</button>
  </div>

  <div id="movieSection" class="result">
    <div id="movieResults" class="grid"></div>
    <div id="movieDetail"></div>
  </div>

  <div id="imageSection" class="result" style="display:none;">
    <div id="imageResults" class="grid"></div>
  </div>
</div>

<div class="credit">
  Bu sayt TMDB API va Unsplash API’dan foydalanadi.
  <br>
  “This product uses the TMDB API but is not endorsed or certified by TMDB.”
</div>

<script>
const TMDB_API_KEY = "SIZNING_TMDB_KALITINGIZ";
const UNSPLASH_ACCESS_KEY = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJlYzYxMDQ0NWFmZGFhY2I5MTY1Njg5ZjEzZjM0ZWQ4ZiIsIm5iZiI6MTc5NDIxNzgzNC43NTksInN1YiI6IjZhZjE5NzZhNDA0YTI2YjNiNGE5NjM2MyIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.MQR-6xE4oBgANXRgBcpu48x9ZwKZ9FQ7O51u03XWBdM";
const TMDB_IMAGE = "https://image.tmdb.org/t/p/w500";
let currentTab = "movie";

function switchTab(tab) {
  currentTab = tab;
  document.getElementById("movieSection").style.display = tab === "movie" ? "block" : "none";
  document.getElementById("imageSection").style.display = tab === "image" ? "block" : "none";

  document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
  event.target.classList.add("active");
}

async function search() {
  const query = document.getElementById("query").value.trim();
  if (!query) return alert("Qidiruv so‘zini kiriting");

  if (currentTab === "movie") {
    await searchMovies(query);
  } else {
    await searchImages(query);
  }
}

async function searchMovies(query) {
  const url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=ru-RU`;
  const response = await fetch(url);
  const data = await response.json();

  const box = document.getElementById("movieResults");
  box.innerHTML = "";

  data.results
    .filter(item => item.media_type === "movie" || item.media_type === "tv")
    .forEach(item => {
      const title = item.title || item.name;
      const poster = item.poster_path ? TMDB_IMAGE + item.poster_path : "";
      const date = item.release_date || item.first_air_date || "";

      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => showMovie(item);

      card.innerHTML = `
        <img src="${poster}" alt="${title}">
        <div class="card-info">
          <h3>${title}</h3>
          <p>${date} • Reyting: ${item.vote_average || 0}</p>
        </div>
      `;

      box.appendChild(card);
    });
}

async function showMovie(item) {
  const type = item.media_type;
  const id = item.id;
  const url = `https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${TMDB_API_KEY}&language=ru-RU`;
  const response = await fetch(url);
  const data = await response.json();

  const trailer = data.results.find(video => video.site === "YouTube" && video.type === "Trailer");
  const title = item.title || item.name;

  document.getElementById("movieDetail").innerHTML = `
    <h2>${title}</h2>
    <p>${item.overview || "Tavsif mavjud emas."}</p>
    ${trailer ? `<iframe class="trailer" src="https://www.youtube.com/embed/${trailer.key}" allowfullscreen></iframe>` : ""}
    <div class="watch-links">
      <a href="https://www.themoviedb.org/${type}/${id}" target="_blank">TMDB’da ko‘rish</a>
      <a href="https://www.justwatch.com/" target="_blank">Qonuniy platformalarda topish</a>
    </div>
  `;

  document.getElementById("movieDetail").scrollIntoView({ behavior: "smooth" });
}

async function searchImages(query) {
  const url = `https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=24&client_id=${UNSPLASH_ACCESS_KEY}`;
  const response = await fetch(url);
  const data = await response.json();

  const box = document.getElementById("imageResults");
  box.innerHTML = "";

  data.results.forEach(photo => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${photo.urls.small}" alt="${photo.alt_description || "Rasm"}">
      <div class="card-info">
        <h3>${photo.user.name}</h3>
        <p><a href="${photo.links.html}?utm_source=Nexorya&utm_medium=referral" target="_blank">Unsplash’da ko‘rish</a></p>
      </div>
    `;

    box.appendChild(card);
  });
}

document.getElementById("query").addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});
</script>

</body>
</html>
