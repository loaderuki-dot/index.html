<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexorya — Free Online IT Tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e1b4b);
    color: #fff;
    min-height: 100vh;
  }
  header {
    padding: 50px 20px;
    text-align: center;
    background: radial-gradient(circle at top, rgba(99,102,241,0.25), transparent);
  }
  header h1 { font-size: 38px; margin-bottom: 10px; }
  header p { color: #94a3b8; font-size: 18px; }
  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 30px 20px;
  }
  .tool {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .tool h2 { margin-bottom: 14px; }
  input, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #fff;
    font-size: 16px;
    margin-bottom: 12px;
  }
  textarea { height: 120px; resize: vertical; }
  button {
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    margin-right: 8px;
  }
  .result {
    margin-top: 14px;
    padding: 14px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    word-break: break-all;
  }
  .qr-img {
    margin-top: 14px;
    background: #fff;
    padding: 10px;
    border-radius: 10px;
  }
  footer {
    margin-top: 50px;
    padding: 25px;
    text-align: center;
    color: #64748b;
  }
</style>
</head>
<body>

<header>
  <h1>Nexorya</h1>
  <p>Free Online IT Tools</p>
</header>

<div class="container">

  <div class="tool">
    <h2>🔐 Password Generator</h2>
    <input id="passLength" type="number" value="16" min="8" max="64">
    <button onclick="generatePassword()">Generate Password</button>
    <div id="passwordResult" class="result">Parol bu yerda chiqadi</div>
  </div>

  <div class="tool">
    <h2>📱 QR Code Generator</h2>
    <input id="qrText" placeholder="Link yoki matn yozing">
    <button onclick="generateQR()">Generate QR</button>
    <div id="qrResult"></div>
  </div>

  <div class="tool">
    <h2>🔤 Text Case Converter</h2>
    <textarea id="textInput" placeholder="Matn kiriting"></textarea>
    <button onclick="toUpperCaseText()">UPPERCASE</button>
    <button onclick="toLowerCaseText()">lowercase</button>
    <button onclick="toTitleCase()">Title Case</button>
    <div id="textResult" class="result">Natija bu yerda chiqadi</div>
  </div>

  <div class="tool">
    <h2>📊 Word Counter</h2>
    <textarea id="countInput" placeholder="Matn kiriting"></textarea>
    <button onclick="countWords()">Count</button>
    <div id="countResult" class="result">Natija bu yerda chiqadi</div>
  </div>

</div>

<footer>
  © 2026 Nexorya. All rights reserved.
</footer>

<script>
function generatePassword() {
  const length = document.getElementById("passLength").value;
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
  let password = "";

  for (let i = 0; i < length; i++) {
    password += chars[Math.floor(Math.random() * chars.length)];
  }

  document.getElementById("passwordResult").innerText = password;
}

function generateQR() {
  const text = document.getElementById("qrText").value;
  if (!text) return alert("Matn kiriting");

  const url = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(text);

  document.getElementById("qrResult").innerHTML =
    `<img class="qr-img" src="${url}" alt="QR Code">`;
}

function toUpperCaseText() {
  const text = document.getElementById("textInput").value;
  document.getElementById("textResult").innerText = text.toUpperCase();
}

function toLowerCaseText() {
  const text = document.getElementById("textInput").value;
  document.getElementById("textResult").innerText = text.toLowerCase();
}

function toTitleCase() {
  const text = document.getElementById("textInput").value;
  const result = text
    .toLowerCase()
    .split(" ")
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join(" ");

  document.getElementById("textResult").innerText = result;
}

function countWords() {
  const text = document.getElementById("countInput").value.trim();

  if (!text) {
    document.getElementById("countResult").innerText = "Matn kiriting";
    return;
  }

  const words = text.split(/\s+/).length;
  const characters = text.length;

  document.getElementById("countResult").innerText =
    `So‘zlar: ${words} | Belgilar: ${characters}`;
}
</script>

</body>
</html>
